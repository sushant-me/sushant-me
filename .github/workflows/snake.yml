# Generates the contribution snake from THIS account's contribution graph and
# publishes it to the `output` branch, which the profile README then renders.
#
# The README previously pointed at Platane/snk's own `output` branch, which is
# that project's demo asset - so the animation on the profile showed someone
# else's grid. This workflow makes it genuinely yours.
name: Generate snake animation

on:
  schedule:
    # Daily at 00:10 UTC.
    - cron: "10 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the SVG
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
